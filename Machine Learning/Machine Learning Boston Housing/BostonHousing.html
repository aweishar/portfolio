<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boston Housing Project</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class', 
            theme: {
                extend: {
                    colors: {
                        gray: {
                            50: '#fafafa',
                            100: '#f5f5f5',
                            200: '#e5e5e5',
                            300: '#d4d4d4',
                            400: '#a3a3a3',
                            500: '#737373',
                            600: '#525252',
                            700: '#404040',
                            800: '#262626',
                            900: '#171717',
                        }
                    }
                }
            }
        }
    </script>

    <script>
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark')
        } else {
            document.documentElement.classList.remove('dark')
        }
    </script>

    <style>
        body { 
            font-family: 'Inter', sans-serif; 
        }
        
        /* Smooth transition */
        body, div, header, h1, h2, section, p, th, td {
            transition-property: background-color, border-color, color;
            transition-duration: 300ms;
        }

        /* Custom Table Styling for Light/Dark Mode */
        #csv-display table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            table-layout: auto; 
            font-size: 0.85rem;
        }

        #csv-display th, #csv-display td {
            padding: 12px;
            text-align: left;
            white-space: nowrap;
            border-bottom-width: 1px;
        }

        /* Light Mode Table Defaults */
        #csv-display th { background-color: #f5f5f5; color: #374151; border-color: #e5e5e5; font-weight: 600; }
        #csv-display td { color: #4b5563; border-color: #e5e5e5; }

        /* Dark Mode Table Overrides */
        .dark #csv-display th { background-color: #262626; color: #e5e5e5; border-color: #404040; }
        .dark #csv-display td { color: #d4d4d4; border-color: #404040; }
    </style>
    <link rel="stylesheet" href="../project-navigation.css">
</head>
<body class="antialiased bg-gray-50 dark:bg-neutral-950 dark:text-neutral-100">
    <nav class="ml-navigation" aria-label="Project navigation">
        <a href="../../index.html">← Back to portfolio</a>
        <a href="BostonHousingNotebook.html">View Notebook</a>
        <a href="BostonHousing.html" aria-current="page">View Raw Data</a>
    </nav>


    <header class="bg-white dark:bg-neutral-900 shadow-sm transition-colors duration-300 mb-10">
        <div class="container mx-auto px-4 py-8 text-center">
            <h1 class="text-3xl font-bold text-gray-900 dark:text-white mb-2">🏠 Boston Housing Price Prediction</h1>
            <p class="text-gray-600 dark:text-neutral-400">Raw Data Preview</p>
        </div>
    </header>

    <div class="container mx-auto px-4 pb-20">
        <p class="mb-6"><a href="BostonHousing.csv" download class="underline font-semibold">Download full dataset (CSV)</a></p>
        
        <div class="grid grid-cols-1 gap-6">
            
            <div class="min-w-0">
                <div class="bg-white dark:bg-neutral-800 rounded-xl shadow-lg overflow-hidden h-full">
                    <div class="bg-gray-100 dark:bg-neutral-700 px-6 py-4 border-b dark:border-neutral-600">
                        <h5 class="font-semibold text-gray-800 dark:text-white">
                            <i class="bi bi-file-earmark-spreadsheet mr-2"></i> Raw Data Display: BostonHousing.csv
                        </h5>
                    </div>
                    <div class="p-0 overflow-x-auto">
                        <div class="p-4">
                            <div id="csv-display" class="w-full">
                                <p class="text-gray-500 dark:text-neutral-400 animate-pulse">Loading data...</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

<script>
    // JavaScript code to fetch and display the CSV file
    const csvFile = 'BostonHousing.csv';
    const csvDisplay = document.getElementById('csv-display');

    fetch(csvFile)
        .then(response => {
            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }
            return response.text();
        })
        .then(data => {
            const rows = data.trim().split('\n');
            const rowsToDisplay = rows.slice(0, 11); 

            let html = '<table>';
            const headers = rowsToDisplay[0].split(',');
            html += '<thead><tr>';
            headers.forEach(header => { html += `<th>${header.trim()}</th>`; });
            html += '</tr></thead><tbody>';

            for (let i = 1; i < rowsToDisplay.length; i++) {
                const cells = rowsToDisplay[i].split(',');
                html += '<tr>';
                cells.forEach(cell => { html += `<td>${cell.trim()}</td>`; });
                html += '</tr>';
            }

            html += '</tbody></table>';

            if (rows.length > 11) {
                // Styled the truncation text for dark mode
                html += `<p class="mt-4 text-sm text-gray-500 dark:text-neutral-500 italic">... Displaying ${rowsToDisplay.length - 1} out of ${rows.length - 1} data rows.</p>`;
            } else if (rows.length === 1) {
                 html = `<p class="text-red-500">Error: CSV file is empty or only contains a header.</p>`;
            }

            csvDisplay.innerHTML = html;
        })
        .catch(error => {
            csvDisplay.innerHTML = `<div class="p-4 bg-red-100 dark:bg-red-900 text-red-700 dark:text-red-200 rounded-lg">Error loading the CSV file: ${error.message}. Please ensure the file exists.</div>`;
            console.error('Error fetching CSV:', error);
        });

</script>

</body>
</html>
